<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaflet JS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/anshori/Leaflet.awesome-markers@3.0/develop/dist/leaflet.awesome-markers.css">
    <style>
        html,
        body,
        #map {
            width: 100%;
            height: calc(100vh - 56px);
            margin: 0;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="https://id.wikipedia.org/wiki/Kabupaten_Flores_Timur" target="_blank"><i
                            class="bi bi-link-45deg"></i>
                        Link</a>
                    <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#aboutModal"><i
                            class="bi bi-info-circle"></i> About</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Modal About -->
    <div class="modal fade" id="aboutModal" tabindex="-1" aria-labelledby="aboutModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="aboutModalLabel">About</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-striped table-bordered">
                        <tr>
                            <th>Nama</th>
                            <td>Rizky Pratama Riyanto</td>
                        </tr>
                        <tr>
                            <th>NIM</th>
                            <td>25/568899/SV/27557</td>
                        </tr>
                        <tr>
                            <th>Kelas</th>
                            <td>PGWEB A</td>
                        </tr>
                        <tr>
                            <th>Praktikum</th>
                            <td>Acara 6 - LEAFLET BOOTSTRAP</td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Jumlah Penduduk -->
    <div class="modal fade" id="pendudukModal" tabindex="-1" aria-labelledby="pendudukModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="pendudukModalLabel">Detail Penduduk</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="pendudukModalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <div id="map"></div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/gh/anshori/Leaflet.awesome-markers@3.0/develop/dist/leaflet.awesome-markers.js"></script>
    <script>
        // Inisialisasi peta
        var map = L.map("map").setView([-8.3555405, 122.9933167], 13);

        // Tile Layer Base Map
        var basemap = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        });

        // Menambahkan basemap ke dalam peta
        basemap.addTo(map);

        // Map Panes
        // Membuat pane untuk layer jumlah penduduk
        map.createPane('paneJumlahPenduduk');
        map.getPane('paneJumlahPenduduk').style.zIndex = 400;

        // Membuat pane untuk layer jalan (z-index lebih besar agar garis jalan berada di atas poligon jumlah penduduk)
        map.createPane('paneJalan');
        map.getPane('paneJalan').style.zIndex = 450;

        // GeoJSON Toponimi
        var toponimi = L.geoJSON(null, {
            // Style
            pointToLayer: function (feature, latlng) {
                var nama_unsur = feature.properties.NAMA_UNSUR;
                var iconMarker;

                if (nama_unsur === "Gunung") {
                    iconMarker = L.AwesomeMarkers.icon({
                        icon: 'mountain',
                        prefix: 'fa',
                        stylePrefix: 'fas',
                        markerColor: 'red',
                        iconColor: 'white',
                    });
                } else if (nama_unsur === "Tanjung") {
                    iconMarker = L.AwesomeMarkers.icon({
                        icon: 'anchor',
                        prefix: 'fa',
                        stylePrefix: 'fas',
                        markerColor: 'orange',
                        iconColor: 'white',
                    });
                } else if (nama_unsur === "Teluk") {
                    iconMarker = L.AwesomeMarkers.icon({
                        icon: 'water',
                        prefix: 'fa',
                        stylePrefix: 'fas',
                        markerColor: 'blue',
                        iconColor: 'white',
                    });
                } else {
                    iconMarker = L.AwesomeMarkers.icon({
                        icon: 'home',
                        prefix: 'fa',
                        stylePrefix: 'fas',
                        markerColor: 'green',
                        iconColor: 'white',
                    });
                }

                return L.marker(latlng, {
                    icon: iconMarker,
                });
            },
            // onEachFeature
            onEachFeature: function (feature, layer) {
                // variable popup content
                var img_tag = feature.properties.image ? "<img src='images/" + feature.properties.image + "' alt='' width='200'><br>" : "";
                var popup_content = img_tag +
                    "<strong>Nama:</strong> " + feature.properties.TOPONIMI + "<br>" +
                    "<strong>Unsur:</strong> " + feature.properties.NAMA_UNSUR + "<br>" +
                    "<strong>Koordinat:</strong> " + feature.geometry.coordinates[1] + ", " + feature.geometry.coordinates[0];

                layer.on({
                    click: function (e) {
                        toponimi.bindPopup(popup_content);
                    },
                    mouseover: function (e) {
                        toponimi.bindTooltip(feature.properties.TOPONIMI, {
                            direction: "left",
                            sticky: true,
                        });
                    },
                });
            },
        });

        $.getJSON("GeoJSON/toponimi1.geojson", function (data) {
            toponimi.addData(data); // Menambahkan data ke dalam GeoJSON Toponimi
            map.addLayer(toponimi); // Menambahkan GeoJSON Toponimi ke dalam peta
        });

        // GeoJSON Polyline Jalan
        var jalan = L.geoJSON(null, {
            pane: 'paneJalan',
            // Style
            style: function (feature) {
                if (feature.properties.NAMA_UNSUR === "Jalan Propinsi") {
                    return {
                        color: "red",
                        opacity: 1,
                        weight: 3.5,
                    };
                }
                if (feature.properties.NAMA_UNSUR === "Jalan Kabupaten") {
                    return {
                        color: "red",
                        opacity: 1,
                        weight: 2.5,
                        dashArray: "6, 6",
                    };
                }
                if (feature.properties.NAMA_UNSUR === "Jalan Lain") {
                    return {
                        color: "#aaaaaa",
                        opacity: 1,
                        weight: 1,
                    };
                }
            },
            // onEachFeature
            onEachFeature: function (feature, layer) {
                // variable popup content
                var popup_content = "Fungsi: " + feature.properties.NAMA_UNSUR + "<br>" +
                    "Panjang (km): " + feature.properties.Panjang_km;

                layer.on({
                    click: function (e) {
                        jalan.bindPopup(popup_content);
                    },
                    mouseover: function (e) {
                        jalan.bindTooltip(feature.properties.NAMA_UNSUR, {
                            direction: "auto",
                            sticky: true,
                        });
                    },
                });
            },
        });

        $.getJSON("GeoJSON/jalan.geojson", function (data) {
            jalan.addData(data); // Menambahkan data ke dalam GeoJSON Polyline Jalan
            map.addLayer(jalan); // Menambahkan GeoJSON Polyline Jalan ke dalam peta
        });

        // GeoJSON Polygon Jumlah Penduduk
        var jumlah_penduduk = L.geoJSON(null, {
            pane: 'paneJumlahPenduduk',
            // Style
            style: function (feature) {
                if (feature.properties.Penduduk <= 12000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#ffffb2'
                    }
                }
                if (feature.properties.Penduduk > 12000 && feature.properties.Penduduk <= 24000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#fd8d3c'
                    }
                }
                if (feature.properties.Penduduk > 24000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#bd0026'
                    }
                }
            },
            // onEachFeature
            onEachFeature: function (feature, layer) {
                layer.on({
                    click: function (e) {
                        $("#pendudukModalLabel").html("Kecamatan " + feature.properties.WADMKC);
                        $("#pendudukModalBody").html(
                            "<table class='table table-striped table-bordered'>" +
                            "<tr><th>Kecamatan</th><td>" + feature.properties.WADMKC + "</td></tr>" +
                            "<tr><th>Kabupaten</th><td>" + feature.properties.WADMKK + "</td></tr>" +
                            "<tr><th>Provinsi</th><td>" + feature.properties.WADMPR + "</td></tr>" +
                            "<tr><th>Jumlah Penduduk</th><td>" + Number(feature.properties.Penduduk).toLocaleString('id-ID') + " Jiwa</td></tr>" +
                            "<tr><th>Luas Wilayah</th><td>" + feature.properties.luas_km2 + " km&sup2;</td></tr>" +
                            "</table>"
                        );
                        $("#pendudukModal").modal("show");
                    },
                    mouseover: function (e) {
                        jumlah_penduduk.bindTooltip(feature.properties.WADMKC, {
                            direction: "auto",
                            sticky: true,
                        });
                    },
                });
            },
        });

        $.getJSON("GeoJSON/Jumlah_Penduduk.geojson", function (data) {
            jumlah_penduduk.addData(data); // Menambahkan data ke dalam GeoJSON Polygon Jumlah Penduduk
            map.addLayer(jumlah_penduduk); // Menambahkan GeoJSON Polygon Jumlah Penduduk ke dalam peta
        });

        // control layer
        var baseMaps = {
            "OpenStreetMap": basemap,
        };

        var overlayMaps = {
            ["Toponimi<br><span style='display: block; margin-left: 20px; font-size: 11px; line-height: 18px;'>" +
                "<i class='fas fa-mountain' style='color: red; margin-right: 5px;'></i> Gunung<br>" +
                "<i class='fas fa-anchor' style='color: orange; margin-right: 5px;'></i> Tanjung<br>" +
                "<i class='fas fa-water' style='color: blue; margin-right: 5px;'></i> Teluk<br>" +
                "<i class='fas fa-home' style='color: green; margin-right: 5px;'></i> Toponimi Lain" +
                "</span>"]: toponimi,
            ["Jalan<br><span style='display: block; margin-left: 20px; font-size: 11px; line-height: 18px;'>" +
                "<span style='display: inline-block; width: 16px; height: 3.5px; background-color: red; vertical-align: middle; margin-right: 5px;'></span> Jalan Propinsi<br>" +
                "<svg width='18' height='8' style='vertical-align: middle; margin-right: 5px;'><line x1='0' y1='4' x2='18' y2='4' stroke='red' stroke-width='2.5' stroke-dasharray='4, 3'/></svg> Jalan Kabupaten<br>" +
                "<span style='display: inline-block; width: 16px; height: 2px; background-color: #aaaaaa; vertical-align: middle; margin-right: 5px;'></span> Jalan Lain" +
                "</span>"]: jalan,
            ["Jumlah Penduduk<br><span style='display: block; margin-left: 20px; font-size: 11px; line-height: 18px;'>" +
                "<span style='display: inline-block; width: 12px; height: 12px; background-color: #ffffb2; border: 1px solid #333; vertical-align: middle; margin-right: 5px;'></span> &le; 12.000 Jiwa<br>" +
                "<span style='display: inline-block; width: 12px; height: 12px; background-color: #fd8d3c; border: 1px solid #333; vertical-align: middle; margin-right: 5px;'></span> 12.001 - 24.000 Jiwa<br>" +
                "<span style='display: inline-block; width: 12px; height: 12px; background-color: #bd0026; border: 1px solid #333; vertical-align: middle; margin-right: 5px;'></span> &gt; 24.000 Jiwa" +
                "</span>"]: jumlah_penduduk,
        };

        var controllayer = L.control.layers(baseMaps, overlayMaps, { collapsed: false });
        controllayer.addTo(map);

        // Scale Bar
        L.control.scale({
            position: "bottomleft",
            metric: true,
            imperial: false,
        }).addTo(map);
    </script>
</body>

</html>
